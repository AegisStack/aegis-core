[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "0.1.0"
description = "Policy Enforcement and Observability for Agent Builders"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aegis Team"}
]
keywords = ["agents", "policy", "enforcement", "observability", "mcp", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
]
mcp = [
    "mcp>=0.1.0",
]
s3 = [
    "boto3>=1.28.0",
]
gcs = [
    "google-cloud-storage>=2.10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black==26.5.1",
    "mypy>=1.5.0",
    "types-PyYAML",
    "types-requests",
    "ruff==0.16.1",
]
all = [
    "aegis-sdk[langchain,mcp,s3,gcs]",
]

[project.urls]
Homepage = "https://github.com/AegisStack/aegis-core"
Repository = "https://github.com/AegisStack/aegis-core"
Issues = "https://github.com/AegisStack/aegis-core/issues"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=aegis --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

# NOTE: mypy 1.5+ no longer accepts python_version = "3.9"; 3.10 is the lowest
# it will interpret. CI runs on 3.11, so type-check against 3.10 semantics. The
# package still *runs* on 3.9 (see ruff UP007/UP045 note above).
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Optional integrations (extras) and untyped third-party libs. These are not
# installed in the base lint environment and/or ship no type stubs, so ignore
# their missing imports rather than failing the type check.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "google.cloud",
    "langchain.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the ruleset explicitly so it does not drift as ruff's defaults change
# between versions. E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade.
select = ["E", "F", "W", "I", "UP"]
# UP007/UP045 rewrite Optional[X] to `X | None`, which is py3.10+ runtime
# syntax. This package targets py3.9 where those annotations are evaluated
# (pydantic/dataclasses), so keep the Optional[...] form.
ignore = ["UP007", "UP045"]
