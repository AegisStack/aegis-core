version: 2
updates:
  # SDK (aegis/)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      sdk-dependencies:
        patterns:
          - "*"

  # Dashboard backend
  - package-ecosystem: "pip"
    directory: "/aegis-dashboard/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Dashboard frontend
  - package-ecosystem: "npm"
    directory: "/aegis-dashboard/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
